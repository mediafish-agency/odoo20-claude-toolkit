[project]
name = "odoo20-mcp"
version = "0.1.1"
description = "MCP server for Odoo 20: source index, v20 validation, runtime (odoo-bin) and JSON-2 tools"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "lxml>=5.2",
    "ruff>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
odoo20-mcp = "odoo20_mcp.server:main"
odoo20-check = "odoo20_mcp.check:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["slow: calibration over the whole Odoo tree"]
addopts = "-m 'not slow'"
